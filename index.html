<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hmm.css — thinking states for AI interfaces</title>
<meta name="description" content="Copy-paste thinking, streaming and listening states for AI interfaces. Pure CSS, ~3 kB, with a tiny optional JS helper.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/hmm.css">
<style>
  :root {
    --bg: #09090b;
    --panel: #0e0e11;
    --raise: #151518;
    --hover: #18181b;
    --line: #1f1f23;
    --line-2: #2a2a2f;
    --ink: #fafafa;
    --sub: #a1a1aa;
    --muted: #71717a;
    --dot: rgb(255 255 255 / .06);
    --accent: #a78bfa;
    --str: #86efac;
    --attr: #c4b5fd;
    --sans: "Geist", ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  :root.light {
    --bg: #ffffff;
    --panel: #fafafa;
    --raise: #f4f4f5;
    --hover: #f4f4f5;
    --line: #ececee;
    --line-2: #e0e0e4;
    --ink: #09090b;
    --sub: #52525b;
    --muted: #8b8b94;
    --dot: rgb(9 9 11 / .08);
    --accent: #7c3aed;
    --str: #15803d;
    --attr: #7c3aed;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  code, pre, kbd { font-family: var(--mono); }
  ::selection { background: color-mix(in oklab, var(--accent) 35%, transparent); }

  /* ---------- top bar ---------- */
  .top {
    position: sticky; top: 0; z-index: 30; height: 56px;
    display: flex; align-items: center; gap: 16px; padding: 0 20px;
    background: color-mix(in oklab, var(--bg) 85%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 15px; letter-spacing: -.02em; min-width: 220px; }
  .brand .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--ink); display: grid; place-items: center; }
  .brand .mark .hmm-dots { color: var(--bg); --hmm-size: 3px; gap: 2px; height: auto; }
  .brand .ver { font: 500 11px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 1px 7px; }
  .search {
    display: flex; align-items: center; gap: 10px; width: 280px; height: 34px; padding: 0 8px 0 11px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--muted); font-size: 13px;
    transition: border-color .15s;
  }
  .search:hover { border-color: var(--line-2); }
  .search span { flex: 1; text-align: left; }
  kbd { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--bg); }
  .top-r { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  .ib { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; color: var(--sub); }
  .ib:hover { background: var(--hover); color: var(--ink); }
  .menu-btn { display: none; }

  /* ---------- layout ---------- */
  .shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); max-width: 1440px; margin: 0 auto; }
  .side {
    position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto;
    padding: 24px 12px 40px 20px; border-right: 1px solid var(--line);
    scrollbar-width: thin;
  }
  .side h4 { margin: 22px 0 6px 10px; font-size: 12px; font-weight: 500; color: var(--muted); }
  .side h4:first-child { margin-top: 0; }
  .side a {
    display: flex; align-items: center; justify-content: space-between;
    height: 30px; padding: 0 10px; border-radius: 6px; color: var(--sub); font-size: 13.5px;
  }
  .side a:hover { color: var(--ink); background: var(--hover); }
  .side a.on { color: var(--ink); background: var(--raise); font-weight: 500; }
  .side a .b { font: 500 10px var(--mono); color: var(--muted); }

  main { min-width: 0; padding: 40px 56px 96px; }
  .page { max-width: 880px; margin: 0 auto; animation: in .25s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } }

  .crumb { font-size: 13px; color: var(--muted); margin-bottom: 10px; display: flex; gap: 6px; }
  .crumb b { color: var(--sub); font-weight: 400; }
  h1 { margin: 0 0 10px; font-size: 32px; line-height: 1.15; font-weight: 600; letter-spacing: -.035em; display: flex; align-items: center; gap: 12px; }
  .tag { font: 500 11px var(--mono); color: var(--sub); border: 1px solid var(--line-2); border-radius: 99px; padding: 2px 9px; letter-spacing: 0; }
  .desc { margin: 0 0 32px; font-size: 16px; color: var(--sub); max-width: 40em; text-wrap: pretty; }
  h2 { margin: 48px 0 14px; font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
  h3 { margin: 28px 0 10px; font-size: 15px; font-weight: 600; }
  p { color: var(--sub); }
  p code, li code, td code { font-size: 12.5px; color: var(--ink); background: var(--raise); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
  .page ul { color: var(--sub); padding-left: 20px; }
  .page li { margin: 4px 0; }

  /* ---------- preview ---------- */
  .tabs { display: flex; align-items: center; gap: 2px; margin-bottom: 10px; }
  .tab { height: 32px; padding: 0 12px; border-radius: 7px; color: var(--muted); font-weight: 500; font-size: 13px; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); background: var(--raise); }
  .tabs .sp { flex: 1; }

  .canvas {
    position: relative; height: 380px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    background: radial-gradient(circle, var(--dot) 1px, transparent 1.4px) 0 0 / 20px 20px, var(--panel);
    display: grid; place-items: center;
  }
  .canvas .stage { color: var(--demo, var(--ink)); font-size: 22px; padding: 0 24px 64px; display: grid; place-items: center; width: 100%; }
  .canvas .fit { width: min(440px, 100%); }
  .controls {
    position: absolute; left: 50%; bottom: 14px; translate: -50% 0;
    display: flex; align-items: center; gap: 4px; padding: 5px;
    background: color-mix(in oklab, var(--bg) 80%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 12px; white-space: nowrap;
    box-shadow: 0 8px 30px -12px rgb(0 0 0 / .4);
  }
  .ctl { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; font-size: 12px; color: var(--muted); }
  .ctl + .ctl { border-left: 1px solid var(--line); }
  .ctl output { font: 11.5px var(--mono); color: var(--sub); min-width: 38px; }
  .sw { width: 16px; height: 16px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgb(127 127 127 / .35); }
  .sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--sub); }
  input[type="range"] { -webkit-appearance: none; appearance: none; width: 88px; height: 4px; border-radius: 99px; background: var(--line-2); outline: none; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); border: 0; cursor: pointer; }
  input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--ink); border: 0; }
  .seg { display: flex; gap: 2px; }
  .seg button { height: 22px; padding: 0 8px; border-radius: 5px; font-size: 12px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--raise); color: var(--ink); }
  .reset { font-size: 12px; color: var(--muted); height: 30px; padding: 0 10px; border-radius: 7px; }
  .reset:hover { color: var(--ink); background: var(--hover); }

  /* ---------- code ---------- */
  .code { position: relative; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: hidden; margin: 0 0 12px; }
  .code .bar { display: flex; align-items: center; justify-content: space-between; height: 38px; padding: 0 6px 0 14px; border-bottom: 1px solid var(--line); font: 12px var(--mono); color: var(--muted); }
  .code pre { margin: 0; padding: 16px 18px; overflow-x: auto; font-size: 12.5px; line-height: 1.75; color: var(--sub); }
  .canvas + .code, .code.solo { margin-top: 0; }
  .copy { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: 6px; color: var(--muted); font: 500 12px var(--sans); }
  .copy:hover { color: var(--ink); background: var(--hover); }
  .copy.done { color: #34d399; }
  .t-tag { color: var(--ink); }
  .t-attr { color: var(--attr); }
  .t-str { color: var(--str); }
  .t-com { color: var(--muted); }
  .t-kw { color: var(--attr); }
  .codeview { height: 380px; overflow: auto; margin: 0; }
  .codeview pre { min-height: 100%; }

  .pm { display: flex; gap: 2px; padding: 0 0 0 4px; }
  .pm button { height: 24px; padding: 0 8px; border-radius: 5px; font: 12px var(--mono); color: var(--muted); }
  .pm button[aria-pressed="true"] { color: var(--ink); background: var(--raise); }

  /* ---------- table ---------- */
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-weight: 500; font-size: 12.5px; color: var(--muted); padding: 0 12px 10px 0; border-bottom: 1px solid var(--line); }
  td { padding: 12px 12px 12px 0; border-bottom: 1px solid var(--line); color: var(--sub); vertical-align: top; }
  td:first-child { white-space: nowrap; }
  td .def { font: 12.5px var(--mono); color: var(--muted); }

  .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 64px; }
  .pager a { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; transition: border-color .15s, background .15s; }
  .pager a:hover { border-color: var(--line-2); background: var(--panel); }
  .pager small { display: block; color: var(--muted); font-size: 12px; }
  .pager span { font-weight: 500; }
  .pager .next { text-align: right; grid-column: 2; }

  /* ---------- intro ---------- */
  .hero { padding: 24px 0 8px; }
  .hero h1 { font-size: clamp(36px, 5vw, 52px); letter-spacing: -.045em; line-height: 1.02; display: block; margin-bottom: 18px; }
  .hero h1 .hmm-shimmer { color: var(--muted); --hmm-highlight: var(--ink); --hmm-duration: 3s; }
  .hero .desc { font-size: 17px; margin-bottom: 28px; }
  .cta { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 40px; }
  .btn { height: 40px; display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; border-radius: 9px; font-weight: 500; font-size: 14px; border: 1px solid var(--line-2); }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn.primary:hover { opacity: .9; background: var(--ink); }
  .stats { display: flex; gap: 28px; margin: -12px 0 40px; font-size: 13px; color: var(--muted); }
  .stats b { color: var(--ink); font-weight: 500; margin-right: 4px; }

  .chat { width: min(460px, 100%); display: grid; gap: 16px; font-size: 14px; color: var(--ink); text-align: left; }
  .chat .u { justify-self: end; background: var(--raise); border: 1px solid var(--line); border-radius: 14px 14px 4px 14px; padding: 8px 13px; }
  .chat .a { display: grid; grid-template-columns: 22px 1fr; gap: 12px; }
  .chat .hmm-sparkle { --hmm-size: 20px; --hmm-a: #a78bfa; --hmm-b: #22d3ee; margin-top: 1px; }
  .chat .st { color: var(--muted); height: 22px; --hmm-highlight: var(--ink); }
  .chat .ans { min-height: 72px; color: var(--sub); line-height: 1.6; margin-top: 4px; }
  .chat .ans p { margin: 0; color: inherit; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .tile { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); transition: border-color .15s, transform .15s; display: flex; flex-direction: column; }
  .tile:hover { border-color: var(--line-2); }
  .tile .pv { height: 148px; display: grid; place-items: center; color: var(--demo, var(--ink)); font-size: 16px; padding: 16px;
    background: radial-gradient(circle, var(--dot) 1px, transparent 1.4px) 0 0 / 16px 16px; }
  .tile .pv .fit { width: 100%; }
  .tile .nm { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 13px; font-weight: 500; }
  .tile .nm small { font: 11px var(--mono); color: var(--muted); font-weight: 400; }

  .panel { padding: 13px 15px; border-radius: 14px; background: var(--raise); border: 1px solid var(--line); font-size: 14px; color: var(--sub); display: flex; align-items: center; gap: 10px; }
  .panel .hmm-dots { margin-left: auto; --hmm-size: 5px; color: var(--muted); }
  .msg { display: grid; grid-template-columns: 26px 1fr; gap: 12px; }
  .msg .av { width: 26px; height: 26px; border-radius: 50%; background: var(--raise); border: 1px solid var(--line); }

  /* ---------- command palette ---------- */
  .cmdk { position: fixed; inset: 0; z-index: 50; display: none; place-items: start center; padding-top: 14vh; background: rgb(0 0 0 / .5); backdrop-filter: blur(2px); }
  .cmdk.open { display: grid; }
  .cmdk .box { width: min(560px, 92vw); background: var(--panel); border: 1px solid var(--line-2); border-radius: 14px; overflow: hidden; box-shadow: 0 30px 80px -20px rgb(0 0 0 / .6); animation: pop .15s ease-out; }
  @keyframes pop { from { opacity: 0; transform: scale(.98); } }
  .cmdk input { width: 100%; height: 50px; padding: 0 18px; border: 0; border-bottom: 1px solid var(--line); background: none; outline: none; font-size: 15px; }
  .cmdk ul { list-style: none; margin: 0; padding: 6px; max-height: 340px; overflow: auto; }
  .cmdk li { display: flex; align-items: center; justify-content: space-between; height: 38px; padding: 0 12px; border-radius: 8px; color: var(--sub); cursor: pointer; }
  .cmdk li small { color: var(--muted); font-size: 12px; }
  .cmdk li.sel { background: var(--raise); color: var(--ink); }
  .cmdk .empty { padding: 20px; text-align: center; color: var(--muted); }

  /* ---------- responsive ---------- */
  @media (max-width: 1100px) { main { padding: 32px 32px 80px; } .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 820px) {
    .shell { grid-template-columns: 1fr; }
    .side { position: fixed; top: 56px; left: 0; bottom: 0; height: auto; width: 270px; z-index: 25; background: var(--bg); transform: translateX(-100%); transition: transform .2s; }
    body.nav-open .side { transform: none; box-shadow: 20px 0 60px rgb(0 0 0 / .4); }
    .menu-btn { display: grid; }
    .brand { min-width: 0; }
    .search { width: 34px; padding: 0; justify-content: center; }
    .search span, .search kbd { display: none; }
    main { padding: 24px 18px 72px; }
    .controls { left: 8px; right: 8px; translate: none; overflow-x: auto; }
    .canvas, .codeview { height: 320px; }
  }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr 1fr; gap: 8px; } .tile .pv { height: 120px; font-size: 14px; } .stats { flex-wrap: wrap; gap: 8px 20px; } }
</style>
</head>
<body>

<header class="top">
  <button class="ib menu-btn" id="menu" aria-label="Open navigation">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4.5h12M2 8h12M2 11.5h12"/></svg>
  </button>
  <a class="brand" href="#/"><span class="mark"><span class="hmm-dots"><i></i><i></i><i></i></span></span>hmm.css<span class="ver">v0.1</span></a>
  <button class="search" id="openSearch" aria-label="Search components">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.75"/><path d="m10.5 10.5 3 3"/></svg>
    <span>Search components…</span><kbd>⌘K</kbd>
  </button>
  <div class="top-r">
    <button class="ib" id="theme" aria-label="Toggle theme">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.25"/><path d="M8 1.75v12.5A6.25 6.25 0 0 0 8 1.75Z" fill="currentColor"/></svg>
    </button>
    <a class="ib" href="https://github.com/arjunkshah12345-hash/hmm.css" aria-label="GitHub">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
    </a>
  </div>
</header>

<div class="shell">
  <nav class="side" id="side" aria-label="Docs"></nav>
  <main><div id="view"></div></main>
</div>

<div class="cmdk" id="cmdk" role="dialog" aria-label="Search">
  <div class="box">
    <input id="q" placeholder="Search components…" autocomplete="off" spellcheck="false">
    <ul id="results"></ul>
  </div>
</div>

<script type="module">
import { init, cycle, scramble } from "./src/hmm.js";

const CDN = "https://cdn.jsdelivr.net/gh/arjunkshah12345-hash/hmm.css@main/src";
const dots3 = "<i></i><i></i><i></i>";

/* size: [library default, preview, tile] in px. dur: library default in s. */
const C = [
  { id: "shimmer", name: "Shimmer", group: "Text", dur: 2,
    desc: "A band of light sweeps across the text. The default “the model is thinking” line.",
    html: (s) => `<span class="hmm-shimmer"${s}>Thinking</span>` },
  { id: "ellipsis", name: "Ellipsis", group: "Text", dur: 1.4,
    desc: "Dots that count up after a word. The width is reserved up front, so nothing next to it shifts.",
    html: (s) => `<span class="hmm-ellipsis"${s}>Thinking</span>` },
  { id: "roll", name: "Roll", group: "Text", js: true,
    desc: "Status words that roll up to the next one. Good for showing an agent's steps as they happen.",
    html: (s) => `<span data-hmm-cycle="Thinking|Searching|Reading 12 sources|Writing"${s}></span>`,
    js_: `import { cycle } from "hmm.css/js";\n\nconst stop = cycle(el, ["Thinking", "Searching", "Writing"]);\n// later\nstop();` },
  { id: "scramble", name: "Scramble", group: "Text", js: true,
    desc: "Random glyphs that resolve into each phrase, left to right. Reads well for tool calls and code.",
    html: (s) => `<span data-hmm-cycle="Thinking|Calling tools|Running code" data-hmm-effect="scramble"${s}></span>`,
    js_: `import { scramble } from "hmm.css/js";\n\nawait scramble(el, "Thought for 4s", { duration: 600 });` },
  { id: "wave", name: "Wave", group: "Text", js: true, dur: 1.8,
    desc: "Letters ripple up one after another.",
    html: (s) => `<span class="hmm-wave" data-hmm-split${s}>Reasoning</span>` },
  { id: "glimmer", name: "Glimmer", group: "Text", js: true, dur: 1.8,
    desc: "Letters light up in turn, like a slower, calmer shimmer.",
    html: (s) => `<span class="hmm-glimmer" data-hmm-split${s}>Searching the web</span>` },
  { id: "rise", name: "Rise", group: "Text", js: true, dur: 1.8,
    desc: "Letters blur in from below, then drift out the top.",
    html: (s) => `<span class="hmm-rise" data-hmm-split${s}>Analyzing</span>` },
  { id: "caret", name: "Caret", group: "Text", dur: 1, variants: ["block", "bar", "dot"],
    desc: "A cursor to put after text while it streams in. Comes in block, bar and dot styles.",
    html: (s, v) => `<span${s}>Writing the answer<span class="hmm-caret${v && v !== "block" ? " hmm-caret--" + v : ""}"></span></span>` },

  { id: "dots", name: "Dots", group: "Shapes", dur: 1.2, size: [6, 10, 8],
    desc: "The classic typing bubble: three dots that hop in sequence.",
    html: (s) => `<span class="hmm-dots"${s}>\n  ${dots3}\n</span>` },
  { id: "bars", name: "Bars", group: "Shapes", dur: 1, size: [4, 7, 5],
    desc: "Audio levels for voice input and spoken replies.",
    html: (s) => `<span class="hmm-bars"${s}>\n  <i></i><i></i><i></i><i></i><i></i>\n</span>` },
  { id: "matrix", name: "Matrix", group: "Shapes", dur: 1.4, size: [5, 10, 7],
    desc: "A 3×3 grid with a pulse that runs corner to corner.",
    html: (s) => `<span class="hmm-matrix"${s}>\n  <i></i><i></i><i></i>\n  <i></i><i></i><i></i>\n  <i></i><i></i><i></i>\n</span>` },
  { id: "ping", name: "Ping", group: "Shapes", dur: 1.8, size: [22, 56, 36],
    desc: "A dot sending out rings, for “listening” or “connected”.",
    html: (s) => `<span class="hmm-ping"${s}></span>` },
  { id: "orbit", name: "Orbit", group: "Shapes", dur: 1.1, size: [22, 52, 36],
    desc: "Two dots chasing each other round a circle. A spinner with a bit more character.",
    html: (s) => `<span class="hmm-orbit"${s}></span>` },
  { id: "orb", name: "Orb", group: "Shapes", dur: 2.4, size: [26, 72, 40],
    desc: "A breathing sphere in one colour. Works as an assistant avatar.",
    html: (s) => `<span class="hmm-orb"${s}></span>` },
  { id: "aura", name: "Aura", group: "Shapes", dur: 3, size: [32, 120, 64], noColor: true,
    desc: "A soft multi-colour glow, the voice-mode look. Change the palette with --hmm-a to --hmm-d.",
    html: (s) => `<span class="hmm-aura"${s}></span>` },
  { id: "sparkle", name: "Sparkle", group: "Shapes", dur: 2.2, size: [22, 64, 40],
    desc: "The four-point star used as the “AI” mark, twinkling. Set --hmm-a and --hmm-b for a gradient.",
    html: (s) => `<span class="hmm-sparkle"${s}></span>` },
  { id: "blob", name: "Blob", group: "Shapes", dur: 4, size: [28, 88, 48], noColor: true,
    desc: "A slow, shape-shifting gradient blob.",
    html: (s) => `<span class="hmm-blob"${s}></span>` },

  { id: "trace", name: "Trace", group: "Surfaces", dur: 2.6, surface: true,
    desc: "A light that runs round the border of any box. Wrap a card, an input or a tool-call row with it.",
    html: (s) => `<div class="hmm-trace"${s || ' style="--hmm-radius:14px"'}>\n  <div class="panel">Searching 14 sources <span class="hmm-dots">${dots3}</span></div>\n</div>`,
    code: (s) => `<div class="hmm-trace"${s || ' style="--hmm-radius:14px"'}>\n  <${"!"}-- your card -->\n</div>` },
  { id: "lines", name: "Lines", group: "Surfaces", dur: 1.8, surface: true,
    desc: "Skeleton lines that hold the space before the answer arrives.",
    html: (s) => `<div class="msg"><span class="av"></span><div class="hmm-lines"${s}>${dots3}</div></div>`,
    code: (s) => `<div class="hmm-lines"${s}>\n  ${dots3}\n</div>` },
];
const byId = Object.fromEntries(C.map((c) => [c.id, c]));
const groups = ["Text", "Shapes", "Surfaces"];
const SWATCHES = [null, "#a78bfa", "#38bdf8", "#fb923c", "#34d399", "#f472b6"];

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function hlHTML(src) {
  return src.replace(/<\!--[\s\S]*?-->|<\/?[\w-]+[^>]*>|[^<]+|</g, (tok) => {
    if (tok.startsWith("<" + "!--")) return `<span class="t-com">${esc(tok)}</span>`;
    const m = tok.match(/^<(\/?)([\w-]+)([^>]*?)(\/?)>$/);
    if (!m) return esc(tok);
    const attrs = m[3].replace(/([\w:-]+)(?:=("[^"]*"))?|(\s+)|(.)/g, (x, n, v, ws, o) =>
      ws ? ws : n ? `<span class="t-attr">${n}</span>` + (v ? `=<span class="t-str">${esc(v)}</span>` : "") : esc(o));
    return `&lt;${m[1]}<span class="t-tag">${m[2]}</span>${attrs}${m[4]}&gt;`;
  });
}
function hlJS(src) {
  return src.replace(/(\/\/.*)|("[^"]*")|\b(import|from|const|await|let)\b|(\w+|[^"\/\w]+|.)/g, (m, com, str, kw, rest) => {
    if (com) return `<span class="t-com">${esc(com)}</span>`;
    if (str) return `<span class="t-str">${esc(str)}</span>`;
    if (kw) return `<span class="t-kw">${kw}</span>`;
    return esc(rest);
  });
}
const copyIcon = `<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5.25" y="5.25" width="8.5" height="8.5" rx="1.75"/><path d="M10.75 5.25V3.5A1.25 1.25 0 0 0 9.5 2.25H3.5A1.25 1.25 0 0 0 2.25 3.5v6a1.25 1.25 0 0 0 1.25 1.25h1.75"/></svg>`;
const codeBlock = (label, src, lang = "html", extra = "") =>
  `<div class="code ${extra}"><div class="bar"><span>${label}</span><button class="copy" data-copy="${esc(src).replace(/"/g, "&quot;")}">${copyIcon}<span>Copy</span></button></div><pre>${lang === "js" ? hlJS(src) : lang === "sh" ? esc(src) : hlHTML(src)}</pre></div>`;

/* Stop any running cycle() timers before replacing markup. */
function mount(el, html) {
  el.querySelectorAll("[data-hmm-cycle]").forEach((n) => n._hmmStop && n._hmmStop());
  el.innerHTML = html;
  init(el);
}

/* ---------- sidebar ---------- */
function renderSide() {
  const link = (href, label, b = "") => `<a href="${href}" data-href="${href}">${label}${b}</a>`;
  $("#side").innerHTML =
    `<h4>Getting started</h4>` +
    link("#/", "Introduction") + link("#/installation", "Installation") + link("#/theming", "Theming") +
    groups.map((g) => `<h4>${g}</h4>` + C.filter((c) => c.group === g)
      .map((c) => link(`#/c/${c.id}`, c.name, c.js ? '<span class="b">js</span>' : "")).join("")).join("");
}

/* ---------- pages ---------- */
let demoToken = 0;

function introPage() {
  const tiles = groups.map((g) => `
    <h2>${g}</h2>
    <div class="grid">${C.filter((c) => c.group === g).map((c) => {
      const s = c.size ? ` style="--hmm-size:${c.size[2]}px"` : "";
      return `<a class="tile" href="#/c/${c.id}"><div class="pv">${c.surface ? `<div class="fit">${c.html("")}</div>` : c.html(s)}</div>
        <div class="nm">${c.name}${c.js ? "<small>js</small>" : ""}</div></a>`;
    }).join("")}</div>`).join("");

  return `
    <div class="hero">
      <h1>Thinking states for<br><span class="hmm-shimmer">AI interfaces.</span></h1>
      <p class="desc">Copy-paste loading, streaming and listening indicators for chat apps, agents and copilots. Pure CSS that inherits your text colour, plus a tiny optional helper for the text effects.</p>
      <div class="cta">
        <a class="btn primary" href="#/installation">Get started</a>
        <a class="btn" href="#/c/shimmer">Browse components</a>
      </div>
      <div class="stats"><span><b>19</b>components</span><span><b>3 kB</b>gzipped CSS</span><span><b>0</b>dependencies</span><span><b>MIT</b>licensed</span></div>
    </div>
    <div class="canvas" style="height:340px">
      <div class="chat">
        <div class="u">What landed in CSS this year?</div>
        <div class="a">
          <span class="hmm-sparkle"></span>
          <div><div class="st"><span class="hmm-shimmer" id="statusText">Thinking</span></div><div class="ans" id="answer"></div></div>
        </div>
      </div>
    </div>
    ${tiles}`;
}

async function playChat() {
  const token = ++demoToken;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const alive = () => token === demoToken && $("#statusText");
  const reply = "Scroll-driven animations shipped everywhere, :has() became the everyday parent selector, and @property made custom properties animatable.";
  while (alive()) {
    const st = $("#statusText"), ans = $("#answer");
    ans.innerHTML = "";
    st.className = "hmm-shimmer";
    const stop = cycle(st, ["Thinking", "Searching the web", "Reading 3 sources"], { interval: 1500 });
    await sleep(4300);
    stop();
    if (!alive()) return;
    await scramble(st, "Thought for 4s", { duration: 600 });
    st.className = "";
    const p = document.createElement("p");
    const caret = Object.assign(document.createElement("span"), { className: "hmm-caret hmm-caret--dot" });
    ans.append(p);
    const words = reply.split(" ");
    for (let i = 0; i < words.length && alive(); i++) {
      p.textContent = words.slice(0, i + 1).join(" ");
      p.append(caret);
      await sleep(45 + Math.random() * 60);
    }
    await sleep(800);
    caret.remove();
    await sleep(3500);
  }
}

function installPage() {
  return `
    <div class="crumb">Getting started <b>/</b> <b>Installation</b></div>
    <h1>Installation</h1>
    <p class="desc">One stylesheet. Add the JS helper only if you use the per-letter or text-swapping effects.</p>

    <h2>1. Add the CSS</h2>
    <p>From a CDN:</p>
    ${codeBlock("html", `<link rel="stylesheet" href="${CDN}/hmm.css">`)}
    <p>Or from npm:</p>
    ${codeBlock("terminal", "npm i hmm.css", "sh")}
    ${codeBlock("js", `import "hmm.css";`, "js")}

    <h2>2. Drop in markup</h2>
    <p>Most components are a single class and need no JavaScript.</p>
    ${codeBlock("html", `<span class="hmm-shimmer">Thinking</span>\n\n<p>Streaming answer<span class="hmm-caret"></span></p>`)}

    <h2>3. Text effects (optional)</h2>
    <p>Wave, Glimmer, Rise, Roll and Scramble need the helper. The quickest way is the auto entry, which wires up <code>data-hmm-*</code> attributes on load.</p>
    ${codeBlock("js", `import "hmm.css/auto";`, "js")}
    ${codeBlock("html", `<span class="hmm-wave" data-hmm-split>Reasoning</span>\n<span data-hmm-cycle="Thinking|Searching|Writing"></span>`)}
    <p>Without a bundler:</p>
    ${codeBlock("html", `<script type="module" src="${CDN}/auto.js"><\/script>`)}

    <h3>API</h3>
    <table>
      <tr><th>Function</th><th>What it does</th></tr>
      <tr><td><code>split(el, text?)</code></td><td>Wraps each character for Wave, Glimmer and Rise.</td></tr>
      <tr><td><code>scramble(el, text, { duration })</code></td><td>Decodes from random glyphs into <code>text</code>. Returns a promise.</td></tr>
      <tr><td><code>cycle(el, words, { interval, effect })</code></td><td>Rotates through words using <code>"roll"</code> or <code>"scramble"</code>. Returns <code>stop()</code>.</td></tr>
      <tr><td><code>init(root?)</code></td><td>Wires up <code>data-hmm-*</code> attributes inside <code>root</code>.</td></tr>
    </table>
    ${pager(null, { href: "#/theming", label: "Theming" })}`;
}

function themingPage() {
  return `
    <div class="crumb">Getting started <b>/</b> <b>Theming</b></div>
    <h1>Theming</h1>
    <p class="desc">Every component reads <code>currentColor</code>, so it matches the text around it. Everything else is a custom property.</p>
    ${codeBlock("html", `<span class="hmm-dots" style="color:#a78bfa; --hmm-size:8px; --hmm-duration:1.6s">\n  ${dots3}\n</span>`)}
    <h2>Variables</h2>
    <table>
      <tr><th>Property</th><th>Default</th><th>What it does</th></tr>
      <tr><td><code>--hmm-duration</code></td><td><span class="def">per component</span></td><td>Length of one animation cycle.</td></tr>
      <tr><td><code>--hmm-size</code></td><td><span class="def">per component</span></td><td>Size of the shape components.</td></tr>
      <tr><td><code>--hmm-highlight</code></td><td><span class="def">lighter text</span></td><td>Colour of the shimmer sweep.</td></tr>
      <tr><td><code>--hmm-a</code> … <code>--hmm-d</code></td><td><span class="def">violet, cyan, pink, amber</span></td><td>Palette for Aura, Sparkle, Blob and Trace.</td></tr>
      <tr><td><code>--hmm-radius</code></td><td><span class="def">12px</span></td><td>Corner radius of Trace. Match it to your box.</td></tr>
      <tr><td><code>--hmm-width</code></td><td><span class="def">1.5px</span></td><td>Stroke width of Trace.</td></tr>
    </table>
    <h2>Accessibility</h2>
    <ul>
      <li>When the OS asks for reduced motion, every component switches to a gentle opacity fade.</li>
      <li>The JS helpers keep the real text in a visually hidden copy and hide the animated letters from screen readers.</li>
      <li>Put status text inside an element with <code>role="status"</code> so updates get announced.</li>
    </ul>
    ${pager({ href: "#/installation", label: "Installation" }, { href: "#/c/" + C[0].id, label: C[0].name })}`;
}

function pager(prev, next) {
  return `<div class="pager">${prev ? `<a href="${prev.href}"><small>Previous</small><span>← ${prev.label}</span></a>` : ""}${next ? `<a class="next" href="${next.href}"><small>Next</small><span>${next.label} →</span></a>` : ""}</div>`;
}

/* ---------- component page ---------- */
function componentPage(c) {
  const i = C.indexOf(c);
  const prev = i > 0 ? { href: `#/c/${C[i - 1].id}`, label: C[i - 1].name } : { href: "#/theming", label: "Theming" };
  const next = i < C.length - 1 ? { href: `#/c/${C[i + 1].id}`, label: C[i + 1].name } : null;
  const vars = [];
  if (c.size) vars.push(["--hmm-size", c.size[0] + "px", "Size of the component."]);
  if (c.dur) vars.push(["--hmm-duration", c.dur + "s", "Length of one cycle."]);
  if (c.id === "shimmer") vars.push(["--hmm-highlight", "lighter text", "Colour of the sweep."]);
  if (["aura", "sparkle", "blob", "trace"].includes(c.id)) vars.push(["--hmm-a … --hmm-d", "palette", "Gradient colours."]);
  if (c.id === "trace") vars.push(["--hmm-radius", "12px", "Corner radius. Match your box."], ["--hmm-width", "1.5px", "Stroke width."]);

  return `
    <div class="crumb">${c.group} <b>/</b> <b>${c.name}</b></div>
    <h1>${c.name}${c.js ? '<span class="tag">JS helper</span>' : ""}</h1>
    <p class="desc">${c.desc}</p>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="preview">Preview</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="code">Code</button>
      <span class="sp"></span>
      <button class="reset" id="reset">Reset</button>
    </div>
    <div id="pane"></div>

    <h2>Installation</h2>
    ${codeBlock("html", `<link rel="stylesheet" href="${CDN}/hmm.css">` + (c.js ? `\n<script type="module" src="${CDN}/auto.js"><\/script>` : ""))}

    <h2>Usage</h2>
    <div id="usage"></div>
    ${c.js_ ? `<h3>Drive it from JavaScript</h3>${codeBlock("js", c.js_, "js")}` : ""}

    ${vars.length ? `<h2>Variables</h2><table><tr><th>Property</th><th>Default</th><th>Description</th></tr>
      ${vars.map(([p, d, t]) => `<tr><td><code>${p}</code></td><td><span class="def">${d}</span></td><td>${t}</td></tr>`).join("")}</table>` : ""}
    ${pager(prev, next)}`;
}

function bindComponent(c) {
  const fresh = () => ({ color: null, size: c.size ? c.size[1] : null, dur: c.dur ?? null, variant: c.variants ? c.variants[0] : null });
  let s = fresh();
  let tab = "preview";

  const styleAttr = () => {
    const parts = [];
    if (s.color) parts.push(`color:${s.color}`);
    if (c.size && s.size !== c.size[0]) parts.push(`--hmm-size:${s.size}px`);
    if (c.dur && s.dur !== c.dur) parts.push(`--hmm-duration:${s.dur}s`);
    if (c.id === "trace" && parts.length) parts.unshift("--hmm-radius:14px");
    return parts.length ? ` style="${parts.join("; ")}"` : "";
  };
  const snippet = () => (c.code || c.html)(styleAttr(), s.variant);

  const controls = () => `
    <div class="controls">
      ${c.noColor ? "" : `<div class="ctl">${SWATCHES.map((col) => `<button class="sw" style="--c:${col || "var(--ink)"}" data-col="${col || ""}" aria-pressed="${(s.color || "") === (col || "")}" aria-label="${col || "Inherit"}"></button>`).join("")}</div>`}
      ${c.size ? `<label class="ctl">Size <input type="range" data-k="size" min="${Math.round(c.size[0] * .5)}" max="${c.size[0] * 5}" step="1" value="${s.size}"><output>${s.size}px</output></label>` : ""}
      ${c.dur ? `<label class="ctl">Speed <input type="range" data-k="dur" min="0.3" max="${Math.max(6, c.dur * 2)}" step="0.1" value="${s.dur}"><output>${s.dur}s</output></label>` : ""}
      ${c.variants ? `<div class="ctl seg">${c.variants.map((v) => `<button data-v="${v}" aria-pressed="${s.variant === v}">${v}</button>`).join("")}</div>` : ""}
    </div>`;

  const pane = $("#pane");
  function draw() {
    if (tab === "preview") {
      pane.innerHTML = `<div class="canvas"><div class="stage" id="stage"></div>${controls()}</div>`;
      const html = c.surface ? `<div class="fit">${c.html(styleAttr(), s.variant)}</div>` : c.html(styleAttr(), s.variant);
      mount($("#stage"), html);
    } else {
      pane.innerHTML = codeBlock("index.html", snippet(), "html", "codeview");
    }
    $("#usage").innerHTML = codeBlock("html", snippet());
  }
  /* Slider moves only touch the stage and code, so the thumb isn't rebuilt mid-drag. */
  function refresh() {
    const root = c.surface ? $("#stage").querySelector(".hmm-trace, .hmm-lines") : $("#stage .fit, #stage")?.firstElementChild;
    const st = styleAttr().match(/style="([^"]*)"/);
    root.setAttribute("style", st ? st[1] : c.id === "trace" ? "--hmm-radius:14px" : "");
    $("#usage").innerHTML = codeBlock("html", snippet());
  }

  pane.addEventListener("input", (e) => {
    const k = e.target.dataset.k;
    if (!k) return;
    s[k] = Number(e.target.value);
    e.target.nextElementSibling.textContent = k === "size" ? s.size + "px" : s.dur + "s";
    refresh();
  });
  pane.addEventListener("click", (e) => {
    const sw = e.target.closest(".sw");
    const v = e.target.closest("[data-v]");
    if (sw) {
      s.color = sw.dataset.col || null;
      pane.querySelectorAll(".sw").forEach((b) => b.setAttribute("aria-pressed", b === sw));
      refresh();
    } else if (v) {
      s.variant = v.dataset.v;
      draw();
    }
  });
  document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
    tab = t.dataset.tab;
    document.querySelectorAll(".tab").forEach((x) => x.setAttribute("aria-selected", x === t));
    draw();
  }));
  $("#reset").addEventListener("click", () => { s = fresh(); draw(); });
  draw();
}

/* ---------- router ---------- */
function route() {
  const h = location.hash.replace(/^#/, "") || "/";
  const view = $("#view");
  demoToken++;
  view.querySelectorAll("[data-hmm-cycle]").forEach((n) => n._hmmStop && n._hmmStop());

  let html, after;
  const m = h.match(/^\/c\/([\w-]+)/);
  if (m && byId[m[1]]) { html = componentPage(byId[m[1]]); after = () => bindComponent(byId[m[1]]); }
  else if (h === "/installation") html = installPage();
  else if (h === "/theming") html = themingPage();
  else { html = introPage(); after = playChat; }

  view.innerHTML = `<div class="page">${html}</div>`;
  init(view);
  after && after();

  document.querySelectorAll(".side a").forEach((a) => a.classList.toggle("on", a.dataset.href === "#" + h));
  document.body.classList.remove("nav-open");
  scrollTo({ top: 0, behavior: "instant" });
  const c = m && byId[m[1]];
  document.title = c ? `${c.name} — hmm.css` : "hmm.css — thinking states for AI interfaces";
}

/* ---------- copy ---------- */
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-copy]");
  if (!b) return;
  await navigator.clipboard.writeText(b.dataset.copy);
  const label = b.querySelector("span");
  b.classList.add("done");
  label.textContent = "Copied";
  clearTimeout(b._t);
  b._t = setTimeout(() => { b.classList.remove("done"); label.textContent = "Copy"; }, 1400);
});

/* ---------- command palette ---------- */
const pages = [
  { label: "Introduction", sub: "Getting started", href: "#/" },
  { label: "Installation", sub: "Getting started", href: "#/installation" },
  { label: "Theming", sub: "Getting started", href: "#/theming" },
  ...C.map((c) => ({ label: c.name, sub: c.group, href: `#/c/${c.id}` })),
];
let sel = 0, hits = pages;
const cmdk = $("#cmdk"), q = $("#q"), list = $("#results");
function drawHits() {
  list.innerHTML = hits.length
    ? hits.map((p, i) => `<li class="${i === sel ? "sel" : ""}" data-i="${i}">${p.label}<small>${p.sub}</small></li>`).join("")
    : `<div class="empty">No components match.</div>`;
  list.querySelector(".sel")?.scrollIntoView({ block: "nearest" });
}
function openK() { cmdk.classList.add("open"); q.value = ""; hits = pages; sel = 0; drawHits(); q.focus(); }
function closeK() { cmdk.classList.remove("open"); }
function go(p) { if (p) { location.hash = p.href; closeK(); } }
q.addEventListener("input", () => {
  const t = q.value.toLowerCase().trim();
  hits = pages.filter((p) => (p.label + " " + p.sub).toLowerCase().includes(t))
    .sort((x, y) => (y.label.toLowerCase() === t) - (x.label.toLowerCase() === t));
  sel = 0; drawHits();
});
q.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { sel = Math.min(sel + 1, hits.length - 1); drawHits(); e.preventDefault(); }
  if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); drawHits(); e.preventDefault(); }
  if (e.key === "Enter") go(hits[sel]);
});
list.addEventListener("click", (e) => { const li = e.target.closest("li"); if (li) go(hits[+li.dataset.i]); });
cmdk.addEventListener("click", (e) => { if (e.target === cmdk) closeK(); });
addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); cmdk.classList.contains("open") ? closeK() : openK(); }
  else if (e.key === "/" && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); openK(); }
  else if (e.key === "Escape") { closeK(); document.body.classList.remove("nav-open"); }
});
$("#openSearch").addEventListener("click", openK);

/* ---------- chrome ---------- */
$("#theme").addEventListener("click", () => {
  const light = document.documentElement.classList.toggle("light");
  localStorage.setItem("hmm-theme", light ? "light" : "dark");
});
if (localStorage.getItem("hmm-theme") === "light") document.documentElement.classList.add("light");
$("#menu").addEventListener("click", () => document.body.classList.toggle("nav-open"));

renderSide();
addEventListener("hashchange", route);
route();
</script>
